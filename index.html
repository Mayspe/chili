<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="¿Qué le falta a tu marca? Un diagnóstico de 2 minutos de Somos Chili.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krona+One&family=Fira+Sans:wght@400;500;700;800&family=Reenie+Beanie&family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Mono&display=swap">
<style>
/* Layout: app de una sola pantalla, pensada para el celular. Mazo de cartas al centro, May arriba reaccionando, botones abajo. Look fijo: paleta y tipos de Somos Chili. */
:root {
  --black: #1d1d1b; --pink: #ff7ec0; --green: #17b787; --yellow: #fdc840; --red: #ff2214; --cream: #f4f2ee; --white: #fff;
  --f-display: "Krona One", "Arial Black", system-ui, sans-serif;
  --f-body: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Reenie Beanie", "Bradley Hand", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--black); color: var(--white); font-family: var(--f-body); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
.app { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 22px; gap: 12px; max-width: 520px; margin: 0 auto; }
.bar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: .82rem; }
.logo img { width: 42px; } .logo b { color: var(--red); font-weight: 400; }
.step { font-family: var(--f-display); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: #bdbbb5; }
.prog { width: 100%; height: 6px; background: #3a3a37; border-radius: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--yellow); transition: width .3s ease; }
.may { display: flex; align-items: center; gap: 12px; width: 100%; }
.av { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #cdcbc4; border: 3px solid var(--pink); flex: none; }
.av svg { display: block; width: 100%; height: 100%; }
.say { background: var(--white); color: var(--black); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-weight: 500; font-size: 1rem; min-height: 44px; display: flex; align-items: center; }
.deck { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 62vh; touch-action: none; }
.card { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.35); cursor: grab; user-select: none; will-change: transform; display: flex; flex-direction: column; }
.card:active { cursor: grabbing; }
.card .stamp { position: absolute; top: 22px; padding: 8px 14px; border: 4px solid; border-radius: 10px; font-family: var(--f-display); font-size: 1.05rem; text-transform: uppercase; opacity: 0; transform: rotate(-12deg); pointer-events: none; z-index: 3; }
.card .yes { left: 20px; color: var(--green); border-color: var(--green); background: rgba(255,255,255,.9); }
.card .no { right: 20px; color: var(--red); border-color: var(--red); background: rgba(255,255,255,.9); transform: rotate(12deg); }
/* cartas de situación */
.sit { padding: 30px 26px; justify-content: space-between; }
.sit .k { font-family: var(--f-display); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.sit .q { font-family: var(--f-display); text-transform: uppercase; font-size: clamp(1.25rem, 5.6vw, 1.75rem); line-height: 1.12; text-wrap: balance; }
.sit .h { font-family: var(--f-hand); font-size: 2rem; line-height: 1; }
.c-pink { background: var(--pink); color: var(--black); } .c-yellow { background: var(--yellow); color: var(--black); } .c-green { background: var(--green); color: var(--white); } .c-red { background: var(--red); color: var(--white); } .c-cream { background: var(--cream); color: var(--black); } .c-white { background: var(--white); color: var(--black); }
/* cartas de estilo */
.sty { background: var(--white); color: var(--black); }
.sty .vis { flex: 1; position: relative; overflow: hidden; }
.sty .lab { padding: 14px 20px 18px; background: var(--white); display: grid; gap: 2px; }
.sty .lab b { font-family: var(--f-display); text-transform: uppercase; font-size: 1rem; font-weight: 400; }
.sty .lab span { color: #5d5c57; font-size: .95rem; }
.btns { display: flex; gap: 14px; justify-content: center; width: 100%; }
.b { flex: 1; max-width: 220px; border: 0; border-radius: 999px; padding: 15px 10px; font: 800 1rem var(--f-body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.b.no { background: var(--white); color: var(--red); } .b.yes { background: var(--green); color: var(--white); }
.b:active { transform: scale(.97); }
.hint { font-size: .85rem; color: #9d9b95; text-align: center; margin: 0; }
/* pantallas */
.screen { width: 100%; display: grid; gap: 16px; }
.big { font-family: var(--f-display); text-transform: uppercase; line-height: 1.08; margin: 0; font-weight: 400; font-size: clamp(1.7rem, 8vw, 2.5rem); text-wrap: balance; }
.big em { font-style: normal; color: var(--pink); }
.lead { margin: 0; font-size: 1.08rem; color: #e3e1db; }
.go { justify-self: start; border: 0; border-radius: 999px; background: var(--yellow); color: var(--black); font-family: var(--f-display); font-size: .82rem; text-transform: uppercase; padding: 17px 24px; cursor: pointer; }
.go.ghost { background: transparent; color: var(--white); border: 2px solid var(--white); }
.torn { display: inline-block; background: var(--white); color: var(--black); padding: .4em .7em .5em; clip-path: polygon(0.0% 2.9%,3.8% 1.4%,7.7% 5.9%,11.5% 0.7%,15.4% 4.8%,19.2% 3.3%,23.1% 0.5%,26.9% 4.6%,30.8% 0.3%,34.6% 3.9%,38.5% 0.6%,42.3% 0.8%,46.2% 3.8%,50.0% 7.4%,53.8% 1.1%,57.7% 2.0%,61.5% 5.6%,65.4% 8.5%,69.2% 5.2%,73.1% 3.6%,76.9% 8.8%,80.8% 0.4%,84.6% 7.7%,88.5% 2.6%,92.3% 1.3%,96.2% 1.1%,100.0% 2.8%,100.0% 92.7%,96.2% 98.4%,92.3% 94.8%,88.5% 94.2%,84.6% 96.6%,80.8% 95.1%,76.9% 99.4%,73.1% 99.5%,69.2% 98.1%,65.4% 93.9%,61.5% 96.2%,57.7% 97.2%,53.8% 94.7%,50.0% 95.9%,46.2% 97.3%,42.3% 92.9%,38.5% 93.7%,34.6% 97.8%,30.8% 94.8%,26.9% 95.3%,23.1% 92.1%,19.2% 93.4%,15.4% 97.4%,11.5% 91.2%,7.7% 98.9%,3.8% 96.2%,0.0% 93.2%); }
.howto { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.howto div { border-radius: 18px; padding: 14px; font-weight: 700; }
.howto small { display: block; font-weight: 400; margin-top: 4px; }
/* resultado */
.res-card { background: var(--white); color: var(--black); border-radius: 26px; padding: 22px; display: grid; gap: 14px; }
.tag { justify-self: start; font-family: var(--f-display); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; background: var(--black); color: var(--yellow); padding: 7px 11px; border-radius: 999px; }
.res-card h2 { font-family: var(--f-display); text-transform: uppercase; font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.08; margin: 0; font-weight: 400; }
.res-card p { margin: 0; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 8.5rem 1fr 2.2rem; gap: 8px; align-items: center; font-size: .9rem; font-weight: 500; }
.bar-row .tr { height: 12px; background: #ece9e2; border-radius: 12px; overflow: hidden; }
.bar-row .tr i { display: block; height: 100%; border-radius: 12px; transition: width .8s ease; }
.bar-row span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #5d5c57; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.how li { padding-left: 24px; position: relative; font-weight: 500; }
.how li::before { content: ""; position: absolute; left: 0; top: .4em; width: 13px; height: 13px; border-radius: 50%; background: var(--green); }
.dato { background: var(--black); color: var(--white); border-radius: 18px; padding: 14px 16px; }
.dato b { display: block; font-family: var(--f-display); color: var(--pink); font-size: 1.6rem; font-weight: 400; line-height: 1.1; }
.mood { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mood .mini { aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; position: relative; }
.mood .mini .vis { position: absolute; inset: 0; transform: scale(.36); transform-origin: 0 0; width: 278%; height: 278%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--cream); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: .9rem; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; }
.acts .go { font-size: .72rem; padding: 14px 18px; }
.ok { color: var(--green); font-weight: 700; margin: 0; }
.mailrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--red); border-radius: 18px; padding: 14px 16px; }
.mailrow b { font-size: 1.1rem; } .mailrow button { border: 0; border-radius: 999px; background: var(--white); color: var(--red); font-weight: 800; padding: 8px 14px; cursor: pointer; }
.lid { transform-box: fill-box; transform-origin: 50% 50%; }
.blink .lid { animation: blink .16s ease-in-out; } @keyframes blink { 50% { transform: scaleY(.08); } }
.m-smile { opacity: 0; } .happy .m-smile { opacity: 1; } .happy .m-serious { opacity: 0; } .happy .lid { transform: scaleY(.78); } .blush { transition: opacity .25s; } .happy .blush { opacity: .28; }
.brow { transition: transform .2s ease; }
/* formulario de datos */
.form { background: var(--white); color: var(--black); border-radius: 26px; padding: 22px; display: grid; gap: 12px; }
.form h2 { font-family: var(--f-display); text-transform: uppercase; font-size: clamp(1.3rem, 5.6vw, 1.7rem); line-height: 1.1; margin: 0; font-weight: 400; }
.form p { margin: 0; color: #4a4945; }
.fld { display: grid; gap: 5px; }
.fld label { font-weight: 700; font-size: .9rem; }
.fld label small { font-weight: 400; color: #77756f; }
.fld input, .fld select { font: 500 1rem var(--f-body); color: var(--black); background: var(--cream); border: 2px solid transparent; border-radius: 14px; padding: 13px 14px; width: 100%; }
.fld input:focus, .fld select:focus { outline: none; border-color: var(--pink); background: var(--white); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .two { grid-template-columns: 1fr; } }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; color: #4a4945; }
.chk input { width: 20px; height: 20px; accent-color: var(--green); flex: none; margin-top: 1px; }
.err { color: var(--red); font-weight: 700; margin: 0; min-height: 1.2em; }
.form .go { justify-self: stretch; text-align: center; }
.form .go[disabled] { opacity: .6; cursor: wait; }
@media (prefers-reduced-motion: reduce) { .blink .lid { animation: none; } .prog i, .bar-row .tr i { transition: none; } }
</style>

</head>

  const av = document.getElementById("av"); av.innerHTML = portraitSVG("128 100 144 144", false);
  const svg = av.querySelector("svg");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function mood(m) {
    svg.classList.toggle("happy", m === "happy");

    svg.querySelectorAll(".iris").forEach(ir => ir.setAttribute("transform", m === "left" ? "translate(-4 1)" : m === "right" ? "translate(4 1)" : "translate(0 0)"));
  }
  if (!reduce) (function bl() { setTimeout(() => { svg.classList.add("blink"); setTimeout(() => svg.classList.remove("blink"), 180); bl(); }, 2500 + Math.random() * 3000); })();
  const say = t => { document.getElementById("say").textContent = t; };
  const main = document.getElementById("main"), prog = document.getElementById("prog"), stepEl = document.getElementById("step");

  const PIL = {
    perf: { name: "Paid y datos", col: "var(--green)", t: "Te falta convertir (y medir)", d: "Hay inversión, pero no un sistema: sin medición bien armada no se sabe qué vende. Construimos marca sin olvidarnos de las ventas.", how: ["Tracking completo: Pixel, API de Conversiones, GA4 y UTMs", "Campañas por etapa del funnel, con remarketing", "KPIs de negocio (CPA, ROAS) y optimización continua"], dato: ["+97,3%", "facturación e-commerce vs. 2023 · Familia Bercomat"] },
    est: { name: "Marca y estrategia", col: "var(--red)", t: "Te falta saber a quién le hablás", d: "Antes de producir más, hay que definir para quién, qué te hace distinto y cómo sonás. Ahí arranca todo lo demás.", how: ["Buyer personas con datos: quién compra, por qué y dónde", "Propuesta de valor y posicionamiento", "Identidad visual y tono de voz para todo el equipo"], dato: null },
    eco: { name: "Always on", col: "var(--pink)", t: "Te falta estar always on", d: "Tu marca aparece cuando puede. Construimos audiencias para armar una comunidad que genera demanda.", how: ["Plan y grilla always on", "Gestión de redes y de comunidad", "Contenido pensado para cada canal"], dato: ["+379M", "impresiones en la región · Rust-Oleum Latam"] },
    cont: { name: "Contenido", col: "var(--yellow)", t: "Te falta contenido propio", d: "Contenido original, humanizado y auténtico para cada canal. Con IA cuando suma, para producir más rápido.", how: ["Producción de foto y video", "Cobertura de eventos", "Piezas adaptadas a cada canal"], dato: null },
    seo: { name: "SEO + GEO", col: "var(--black)", t: "Te falta que te encuentren", d: "La gente ya no solo googlea: le pregunta a la IA. SEO + GEO para aparecer en Google y en ChatGPT, Gemini y compañía.", how: ["Auditoría SEO técnica y de contenido", "Estrategia GEO para respuestas de IA", "Datos estructurados y autoridad de marca"], dato: ["Nuevo", "SEO + GEO, lo más nuevo de Chili"] }
  };
  const CAT = { perf: ["Paid y datos", "c-green"], est: ["Marca", "c-red"], eco: ["Redes", "c-pink"], cont: ["Contenido", "c-yellow"], seo: ["SEO + GEO", "c-cream"] };
  const SIT = [
    ["perf", "No tenemos el Pixel de Meta ni la API de Conversiones bien configurados.", { perf: 3 }, "Configurar Pixel + API de Conversiones y eventos clave"],
    ["est", "No tenemos definidos a nuestros buyer personas.", { est: 3 }, "Definir buyer personas con datos: quién compra, por qué y dónde"],
    ["perf", "No sabemos cuánto nos cuesta conseguir un cliente.", { perf: 3 }, "Fijar un CPA / CAC objetivo y medirlo por canal"],
    ["eco", "Publicamos cuando podemos.", { eco: 2 }, "Plan y grilla always on"],
    ["perf", "Medimos likes y alcance, no ventas ni leads.", { perf: 2, est: 1 }, "Pasar a KPIs de negocio: leads, ventas, ROAS"],
    ["est", "Si le preguntás a tres personas del equipo qué nos diferencia, responden distinto.", { est: 3 }, "Propuesta de valor y posicionamiento claros"],
    ["seo", "Si le pregunto a ChatGPT o Gemini por lo que vendemos, no aparecemos.", { seo: 3 }, "Estrategia GEO: contenido y autoridad para aparecer en respuestas de IA"],
    ["perf", "Usamos el mismo anuncio para todo el mundo: no separamos por etapa del funnel.", { perf: 2 }, "Estructura de campañas por funnel: alcance, consideración y conversión"],
    ["est", "Nuestra identidad visual cambia según quién haga la pieza.", { est: 2, cont: 1 }, "Sistema de identidad visual y templates"],
    ["perf", "No le hacemos remarketing a quien ya nos visitó.", { perf: 2 }, "Audiencias de remarketing y secuencias por comportamiento"],
    ["eco", "Tenemos seguidores, pero casi nadie interactúa.", { eco: 2 }, "Gestión de comunidad y contenido que invite a participar"],
    ["perf", "No sabemos qué campañas traen ventas: no hay UTMs ni GA4 bien armado.", { perf: 3 }, "UTMs, GA4 y conversiones para atribuir ventas"],
    ["est", "No tenemos un tono de voz definido.", { est: 2 }, "Guía de tono de voz para todo el equipo"],
    ["cont", "Nos cuesta producir fotos y videos propios.", { cont: 2 }, "Producción de foto y video, también con IA"],
    ["perf", "Boosteamos posteos en lugar de armar campañas.", { perf: 2 }, "Campañas con objetivo, presupuesto y testeo de creatividades"],
    ["seo", "En Google nos encuentra solo quien ya nos busca por nombre.", { seo: 2 }, "SEO técnico y de contenido"]
  ];
  const YES = ["Uh, clásico.", "Anotado.", "Eso tiene arreglo.", "Te entiendo.", "Pasa en las mejores familias.", "Ahí hay plata sobre la mesa."];
  const NO = ["¡Bien ahí!", "Uno menos.", "Eso suma.", "Vamos bien."];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let done = 0; const score = { est: 0, eco: 0, cont: 0, perf: 0, seo: 0 }; const found = []; const ans = [];
  // Dónde se guardan los leads: el Apps Script del Sheet "Chili Swipe · Leads" (función doPost).
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbz69Gco9bKQLTgAYMqHsW2n1vqZekoYmAzlBR5i36a8owOXUgpFih-2J8JbOagS6MqN/exec";
  const QS = new URLSearchParams(location.search);
  const ORIGEN = (QS.get("origen") || QS.get("utm_source") || "web").slice(0, 60);
  const DE = ["may", "majo"].includes((QS.get("de") || "").toLowerCase()) ? QS.get("de").toLowerCase() : "may";
  const CAN_SAVE = /^https?:/.test(location.protocol);
  const setProg = () => { prog.style.width = (done / SIT.length * 100) + "%"; };

  function intro() {
    stepEl.textContent = "Diagnóstico";
    main.innerHTML = `<h1 class="big">¿Qué le falta a <em>tu marca?</em></h1>
      <p class="lead">16 cartas, dos minutos. Paid y datos, marca, redes, contenido y SEO + GEO. Vos solo decís si te pasa o no: el diagnóstico lo armo yo. Al final dejás tus datos y lo ves al toque.</p>
      <div class="howto"><div style="background:var(--green)">→ Derecha<small>me pasa</small></div><div style="background:var(--white);color:var(--red)">← Izquierda<small>no me pasa</small></div></div>
      <button class="go" id="start" type="button">Empezar</button>`;
    document.getElementById("start").addEventListener("click", deck);
    mood("happy");
  }

  function deck() {
    stepEl.textContent = "Lo que te pasa";
    say("¿Te pasa? Derecha si sí, izquierda si no.");
    mood(null);
    main.innerHTML = `<div class="deck" id="deck"></div>
      <div class="btns"><button class="b no" id="bno" type="button">✕ No me pasa</button><button class="b yes" id="byes" type="button">Me pasa ✓</button></div>
      <p class="hint">También podés usar las flechas del teclado.</p>`;
    const dk = document.getElementById("deck");
    let i = 0;
    const make = idx => {
      const it = SIT[idx], c = CAT[it[0]]; const el = document.createElement("div");
      el.className = "card sit " + c[1];
      el.innerHTML = `<span class="stamp yes">Me pasa</span><span class="stamp no">No</span><span class="k">${c[0]} · ${idx + 1} / ${SIT.length}</span><p class="q">${it[1]}</p><span class="h">¿te pasa?</span>`;
      return el;
    };
    function layout() { [...dk.children].forEach((c, j) => { const depth = dk.children.length - 1 - j; c.style.transform = `translateY(${depth * 12}px) scale(${1 - depth * .04})`; c.style.zIndex = 10 - depth; c.style.transition = reduce ? "none" : "transform .25s ease"; }); }
    function fill() { while (dk.children.length < 3 && i + dk.children.length < SIT.length) dk.insertBefore(make(i + dk.children.length), dk.firstChild); layout(); bind(); }
    const top = () => dk.lastElementChild;
    function decide(yes) {
      const c = top(); if (!c) return;
      const idx = i; i++; done++; setProg();
      ans.push(`${idx + 1}. ${yes ? "SÍ" : "no"} · ${SIT[idx][1]}`);
      if (yes) { const w = SIT[idx][2]; for (const k in w) score[k] += w[k]; found.push(SIT[idx]); say(pick(YES)); mood("worried"); } else { say(pick(NO)); mood("happy"); }
      const dir = yes ? 1 : -1;
      c.style.transition = reduce ? "none" : "transform .35s ease, opacity .35s ease";
      c.style.transform = `translate(${dir * 140}%, -4%) rotate(${dir * 24}deg)`; c.style.opacity = "0";
      setTimeout(() => { c.remove(); if (i >= SIT.length) gate(); else fill(); }, reduce ? 0 : 300);
    }
    function bind() {
      const c = top(); if (!c || c.dataset.bound) return; c.dataset.bound = 1;
      let sx = 0, sy = 0, dx = 0, drag = false;
      const ys = c.querySelector(".stamp.yes"), ns = c.querySelector(".stamp.no");
      c.addEventListener("pointerdown", e => { drag = true; sx = e.clientX; sy = e.clientY; c.setPointerCapture(e.pointerId); c.style.transition = "none"; });
      c.addEventListener("pointermove", e => { if (!drag) return; dx = e.clientX - sx; const dy = e.clientY - sy; c.style.transform = `translate(${dx}px, ${dy * .3}px) rotate(${dx / 14}deg)`; ys.style.opacity = Math.max(0, Math.min(1, dx / 90)); ns.style.opacity = Math.max(0, Math.min(1, -dx / 90)); mood(dx > 20 ? "right" : dx < -20 ? "left" : null); });
      const end = () => { if (!drag) return; drag = false; if (Math.abs(dx) > 100) decide(dx > 0); else { layout(); ys.style.opacity = 0; ns.style.opacity = 0; } dx = 0; };
      c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
    }
    document.getElementById("byes").addEventListener("click", () => decide(true));
    document.getElementById("bno").addEventListener("click", () => decide(false));
    keyFn = e => { if (e.key === "ArrowRight") decide(true); if (e.key === "ArrowLeft") decide(false); };
    fill();
  }
  let keyFn = null; addEventListener("keydown", e => keyFn && keyFn(e));

  function calc() {
    const order = Object.keys(score).sort((a, b) => score[b] - score[a]);
    const allZero = score[order[0]] === 0;
    const top = PIL[allZero ? "eco" : order[0]], second = PIL[order[1]];
    const groups = {}; found.forEach(f => { (groups[f[0]] = groups[f[0]] || []).push(f[3]); });
    const fixOrder = order.filter(k => groups[k]);
    return { order, allZero, top, second, groups, fixOrder };
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function gate() {
    keyFn = null; stepEl.textContent = "Último paso"; prog.style.width = "100%";
    say("¡Listo! Dejame tus datos y te muestro el diagnóstico."); mood("happy");
    main.innerHTML = `<form class="form" id="lf" novalidate>
      <h2>Ya tengo tu diagnóstico</h2>
      <p>Encontré <strong>${found.length}</strong> cosas para mejorar. Dejanos tus datos para verlo; alguien del equipo te puede escribir para charlarlo.</p>
      <div class="fld"><label for="f-nom">Nombre y apellido</label><input id="f-nom" name="nombre" autocomplete="name" required></div>
      <div class="fld"><label for="f-emp">Empresa o marca</label><input id="f-emp" name="empresa" autocomplete="organization" required></div>
      <div class="fld"><label for="f-mail">Email</label><input id="f-mail" name="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="two">
        <div class="fld"><label for="f-car">Cargo <small>(opcional)</small></label><input id="f-car" name="cargo" autocomplete="organization-title"></div>
        <div class="fld"><label for="f-tel">WhatsApp <small>(opcional)</small></label><input id="f-tel" name="telefono" type="tel" autocomplete="tel" inputmode="tel"></div>
      </div>
      <div class="fld"><label for="f-tipo">Tu marca es…</label><select id="f-tipo" name="tipo" required>
        <option value="">Elegí una opción</option><option>E-commerce</option><option>Marca de consumo / retail</option><option>B2B / servicios profesionales</option><option>Industria / construcción</option><option>Gastronomía / hotelería</option><option>Educación / salud</option><option>Otro</option>
      </select></div>
      <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label for="f-web">No completar</label><input id="f-web" name="website" tabindex="-1" autocomplete="off"></div>
      <label class="chk"><input type="checkbox" id="f-ok" required><span>Acepto que Somos Chili guarde estos datos para contactarme por este diagnóstico.</span></label>
      <p class="err" id="ferr" aria-live="polite"></p>
      <button class="go" id="send" type="submit">Ver mi diagnóstico</button>
    </form>`;
    const f = document.getElementById("lf"), err = document.getElementById("ferr"), btn = document.getElementById("send");
    f.addEventListener("submit", e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim();
      const d = { nombre: v("f-nom"), empresa: v("f-emp"), email: v("f-mail"), cargo: v("f-car"), telefono: v("f-tel"), tipo: v("f-tipo") };
      if (!d.nombre || !d.empresa || !d.email || !d.tipo) { err.textContent = "Completá nombre, empresa, email y tipo de marca."; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) { err.textContent = "Revisá el email."; return; }
      if (!document.getElementById("f-ok").checked) { err.textContent = "Necesitamos tu OK para guardar los datos."; return; }
      const c = calc();
      const payload = Object.assign(d, {
        principal: c.top.name + " · " + c.top.t, segunda: c.second.name + " · " + c.second.t,
        scores: { perf: score.perf, est: score.est, eco: score.eco, cont: score.cont, seo: score.seo },
        cantidad: found.length,
        encontrado: c.fixOrder.map(k => CAT[k][0] + ": " + c.groups[k].join(" / ")).join("\n"),
        respuestas: ans.join("\n"),
        origen: ORIGEN,
        de: DE,
        hp: (document.getElementById("f-web") || {}).value || ""
      });
      err.textContent = ""; btn.disabled = true; btn.textContent = "Guardando…";
      if (!CAN_SAVE) { result(d.nombre); return; }
      // text/plain evita el preflight de CORS; la respuesta es opaca, así que un error de red es la única falla visible.
      fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .then(() => result(d.nombre))
        .catch(() => { btn.disabled = false; btn.textContent = "Ver mi diagnóstico"; err.textContent = "No pudimos guardar tus datos. Revisá tu conexión y probá de nuevo."; });
    });
  }

  function result(nombre) {
    keyFn = null; stepEl.textContent = "Tu diagnóstico"; prog.style.width = "100%";
    const { order, allZero, top, second, groups, fixOrder } = calc();
    const max = Math.max(1, ...Object.values(score));
    const first = nombre ? esc(nombre.split(" ")[0]) : "";
    say(found.length >= 9 ? "Hay laburo, pero tranqui: para eso estamos." : allZero ? "¡Tu marca viene muy bien! Igual siempre hay algo para potenciar." : "Listo. Esto es lo que veo.");
    mood("happy");
    const summary = `Diagnóstico Chili Swipe\nLo que más le falta a mi marca: ${top.t.toLowerCase()} (${top.name}).\nDespués: ${second.t.toLowerCase()} (${second.name}).\n\nLo que encontramos:\n` + (fixOrder.length ? fixOrder.map(k => `${CAT[k][0]}:\n` + groups[k].map(x => `- ${x}`).join("\n")).join("\n") : "- Nada de la lista. ¡Vienen bien!");
    main.innerHTML = `<div class="res-card">
      ${first ? `<p style="font-family:var(--f-hand);font-size:1.9rem;line-height:1;color:var(--red)">${first}, esto es lo que veo:</p>` : ""}

      <ul class="how">${top.how.map(h => `<li>${h}</li>`).join("")}</ul>
      ${top.dato ? `<div class="dato"><b>${top.dato[0]}</b>${top.dato[1]}</div>` : ""}

    </div>
    <div class="res-card">
      <span class="tag" style="background:var(--pink);color:var(--black)">Lo que encontramos · ${found.length}</span>
      ${fixOrder.length ? fixOrder.map(k => `<div><p style="font-family:var(--f-display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px">${CAT[k][0]}</p><ul class="how">${groups[k].map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("") : `<p>Nada de la lista. Vienen muy bien: hablemos de cómo escalar.</p>`}
    </div>
    <p class="lead">${nombre ? "Tu diagnóstico ya le llegó al equipo de Chili. Si querés adelantarte, escribinos:" : "¿Lo charlamos? Escribinos:"}</p>
    <div class="mailrow"><b>hola@somoschili.com</b><button type="button" id="cpm">Copiar mail</button></div>
    <div class="acts"><button class="go" id="cp" type="button">Copiar mi diagnóstico</button><button class="go ghost" id="again" type="button">Hacerlo de nuevo</button></div>
    <p class="ok" id="okm" hidden>Copiado. Pegalo en un mail a hola@somoschili.com y te respondemos.</p>`;
    requestAnimationFrame(() => main.querySelectorAll(".tr i").forEach(x => { x.style.width = x.dataset.w + "%"; }));
    document.getElementById("cp").addEventListener("click", () => copy(summary, () => { document.getElementById("okm").hidden = false; }));
    const cpm = document.getElementById("cpm"); cpm.addEventListener("click", () => copy("hola@somoschili.com", () => { cpm.textContent = "Copiado"; }));
    document.getElementById("again").addEventListener("click", () => { done = 0; found.length = 0; ans.length = 0; for (const k in score) score[k] = 0; setProg(); intro(); say("Dale, de nuevo."); });
  }
  function copy(text, ok) {
    const fb = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) {} ta.remove(); };
    try { navigator.clipboard.writeText(text).then(ok, fb); } catch (e) { fb(); }
  }
  intro(); setProg();
})();
